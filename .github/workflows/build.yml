name: Unzip and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Unzip Project Files
      run: |
        unzip -o project.zip
        if [ -d "super-status-bar" ]; then cp -rn super-status-bar/* . 2>/dev/null || true; fi
        find . -maxdepth 2 -name "gradlew" -exec chmod +x {} \;

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        else
          find . -maxdepth 2 -name "gradlew" -execdir ./gradlew assembleDebug \;
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: '**/build/outputs/apk/debug/*.apk'
        
