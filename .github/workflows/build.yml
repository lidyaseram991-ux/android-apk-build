name: Unzip and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Clean Old Build Files & Unzip Project
      run: |
        # 1. تنظيف شامل لمخلفات التجميع الأكواد القديمة
        rm -rf app/build gradle/ .gradle/ build/ src/ res/ super-status-bar/
        
        # 2. تحديد اسم الملف المضغوط
        ZIP_FILE="project.zip"
        
        # 3. فك الضغط مع التحقق من وجود الملف
        if [ -f "$ZIP_FILE" ]; then
          unzip -o "$ZIP_FILE"
        else
          echo "خطأ: الملف $ZIP_FILE غير موجود في المستودع!"
          exit 1
        fi
        
        # 4. نقل المحتويات إذا كان الملف ينفك داخل مجلد فرعي باسم super-status-bar
        if [ -d "super-status-bar" ]; then 
          cp -rn super-status-bar/* . 2>/dev/null || true
        fi

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Dummy Debug Keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build Debug APK via Gradle
      run: |
        gradle assembleDebug --no-build-cache --rerun-tasks --warning-mode none

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-v7
        path: '**/build/outputs/apk/debug/*.apk'
        
